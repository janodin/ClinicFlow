{% if slots %}
  <div class="cf-slot-grid">
    {% for slot in slots %}
      <button type="button"
              data-slot="{{ slot.starts_at.isoformat }}"
              data-slot-value="{{ slot.starts_at.isoformat }}"
              data-testid="slot-button"
              @click="selectSlot('{{ slot.starts_at.isoformat }}')"
              :aria-pressed="(slot === '{{ slot.starts_at.isoformat }}').toString()"
              class="cf-slot-button"
              :class="slot === '{{ slot.starts_at.isoformat }}' ? 'border-transparent' : ''"
              :style="slot === '{{ slot.starts_at.isoformat }}' ? 'background-color:' + accentColor + '; border-color:' + accentColor + '; color:' + accentForeground() : ''">
        {{ slot.label }}
      </button>
    {% endfor %}
  </div>
{% else %}
  <div class="rounded-2xl border border-[var(--cf-line)] bg-[var(--cf-surface-muted)] p-5 text-center">
    <p class="font-medium text-[var(--cf-ink)]">No available slots for this date.</p>
    <p class="mt-1 text-sm text-[var(--cf-muted)]">Try another date.</p>
    {% if next_available_date %}
      <p class="mt-3 text-sm">
        Next available:
        <button type="button"
                data-testid="next-available-date"
                @click="date = '{{ next_available_date|date:'Y-m-d' }}'; loadSlots()"
                class="font-bold underline"
                style="color: {{ clinic.safe_widget_accent_color }}">
          {{ next_available_date|date:"l, M j" }}
        </button>
      </p>
    {% endif %}
  </div>
{% endif %}
