{% if slots %}
  <div class="cf-slot-grid">
    {% for slot in slots %}
      <button type="button"
              data-slot="{{ slot.starts_at.isoformat }}"
              data-testid="slot-button"
              @click="slot = '{{ slot.starts_at.isoformat }}'"
              class="cf-slot-button transition-colors focus:outline-none focus:ring-2 focus:ring-offset-1"
              :class="slot === '{{ slot.starts_at.isoformat }}' ? 'text-white border-transparent' : 'bg-white text-slate-700 border-slate-200'"
              :style="slot === '{{ slot.starts_at.isoformat }}' ? 'background-color: var(--cf-brand-strong); border-color: var(--cf-brand-strong);' : ''">
        {{ slot.label }}
      </button>
    {% endfor %}
  </div>
{% else %}
  <div class="rounded-2xl bg-slate-50 p-5 text-center">
    <p class="font-medium text-slate-600">No available slots for this date.</p>
    <p class="mt-1 text-sm text-slate-500">Try another date.</p>
    {% if next_available_date %}
      <p class="mt-3 text-sm">
        Next available:
        <button type="button"
                data-testid="next-available-date"
                @click="date = '{{ next_available_date|date:'Y-m-d' }}'; loadSlots()"
                class="font-bold underline"
                style="color: {{ clinic.widget_accent_color }}">
          {{ next_available_date|date:"l, M j" }}
        </button>
      </p>
    {% endif %}
  </div>
{% endif %}
