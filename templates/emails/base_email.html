<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block email_title %}ClinicFlow{% endblock %}</title>
  <style>
    body { margin: 0; padding: 0; background-color: #f8fafc; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .wrapper { width: 100%; padding: 32px 0; }
    .container { max-width: 560px; margin: 0 auto; background: #ffffff; border-radius: 16px; border: 1px solid #e2e8f0; overflow: hidden; }
    .header { background: #0891b2; padding: 24px 32px; text-align: center; }
    .header h1 { color: #ffffff; margin: 0; font-size: 20px; font-weight: 800; }
    .content { padding: 28px 32px; color: #334155; font-size: 15px; line-height: 1.6; }
    .content h2 { margin-top: 0; font-size: 18px; color: #0f172a; }
    .detail-row { margin-bottom: 8px; }
    .detail-label { font-weight: 700; color: #475569; }
    .footer { padding: 20px 32px; text-align: center; font-size: 13px; color: #94a3b8; background: #f8fafc; border-top: 1px solid #e2e8f0; }
    .btn { display: inline-block; padding: 10px 20px; background: #0891b2; color: #ffffff; text-decoration: none; border-radius: 10px; font-weight: 700; font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <div class="header">
        <h1>{{ clinic_name|default:"ClinicFlow" }}</h1>
      </div>
      <div class="content">
        {% block content %}{% endblock %}
      </div>
      <div class="footer">
        Sent by ClinicFlow &middot; This is an automated message.
      </div>
    </div>
  </div>
</body>
</html>
