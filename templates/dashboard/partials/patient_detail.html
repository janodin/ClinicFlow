{% extends "dashboard/base.html" %}
{% block title %}{{ patient.full_name }}{% endblock %}
{% block content %}
<div x-data="{detailOpen:false, editOpen:false, patientDeleteOpen:false, focusModal(root) { this.$nextTick(() => root.querySelector('button, [href], input, select, textarea')?.focus()) }, trapModalFocus(event, root) { const focusable = Array.from(root.querySelectorAll(`a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex='-1'])`)).filter((el) => el.offsetParent !== null); if (!focusable.length) return; const first = focusable[0]; const last = focusable[focusable.length - 1]; if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); } else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); } } }" @keydown.escape.window="detailOpen=false; editOpen=false; patientDeleteOpen=false" x-on:appointment-deleted.camel="detailOpen=false; $nextTick(() => document.getElementById('visit-history-heading')?.focus())" x-on:patient-delete-blocked.window="patientDeleteOpen=false">
  <div id="patient-detail-content" class="cf-page">
    {% include "dashboard/partials/patient_detail_content.html" %}
  </div>

  <!-- Appointment Detail Modal -->
  <div x-show="detailOpen" class="cf-modal-backdrop" x-cloak @click.self="detailOpen=false" @keydown.tab="trapModalFocus($event, $el)" tabindex="-1" x-effect="if (detailOpen) focusModal($el)">
    <div class="cf-modal cf-modal-lg" role="dialog" aria-modal="true" aria-labelledby="appointment-detail-title" @click.stop>
      <div id="detail-modal-body">
        <div class="cf-modal-header sr-only">
          <h2 id="appointment-detail-title" class="cf-modal-title">Appointment details</h2>
        </div>
        <div class="cf-modal-body">
          <div class="flex items-center justify-center py-8">
            <i data-lucide="loader-2" class="h-6 w-6 animate-spin text-[var(--cf-muted)]"></i>
            <span class="ml-2 text-sm text-[var(--cf-muted)]">Loading appointment details...</span>
          </div>
        </div>
        <div class="cf-modal-footer sr-only"></div>
      </div>
    </div>
  </div>

  <!-- Edit Patient Modal -->
  <div x-show="editOpen" class="cf-modal-backdrop" x-cloak @click.self="editOpen=false" @keydown.tab="trapModalFocus($event, $el)" tabindex="-1" x-effect="if (editOpen) focusModal($el)">
    <div class="cf-modal cf-modal-md" role="dialog" aria-modal="true" aria-labelledby="patient-edit-modal-title" @click.stop>
      <div id="edit-modal-body">
        <div class="cf-modal-header sr-only">
          <h2 id="patient-edit-modal-title" class="cf-modal-title">Edit patient</h2>
        </div>
        <div class="cf-modal-body">
          <div class="flex items-center justify-center py-8">
            <i data-lucide="loader-2" class="h-6 w-6 animate-spin text-[var(--cf-muted)]"></i>
            <span class="ml-2 text-sm text-[var(--cf-muted)]">Loading patient form...</span>
          </div>
        </div>
        <div class="cf-modal-footer sr-only"></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
