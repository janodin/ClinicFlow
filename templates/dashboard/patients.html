{% extends "dashboard/base.html" %}
{% block title %}Patients{% endblock %}
{% block content %}
<div x-data="{patientOpen:false, editOpen:false}" class="cf-page">
  <div class="cf-page-header">
    <div><h1 class="ui-page-title">Patients</h1><p class="mt-2 text-sm text-[var(--cf-muted)]">{{ patients|length }} patient records registered</p></div>
    <div class="flex items-center gap-3">
      <button hx-get="{% url 'dashboard:find_duplicates' %}" hx-target="#duplicate-panel" hx-swap="innerHTML" class="cf-btn cf-btn-secondary">Check Duplicates</button>
      <button @click="patientOpen=true" class="cf-btn cf-btn-primary">Add Patient</button>
    </div>
  </div>
  <div id="duplicate-panel"></div>
  <form class="max-w-2xl" method="get">
    <input name="q" value="{{ query }}" placeholder="Search by name, phone, or email..." class="ui-input"
           hx-get="{% url 'dashboard:patients' %}"
           hx-target="#patient-list"
           hx-swap="innerHTML"
           hx-trigger="keyup changed delay:300ms, search"
           hx-push-url="true">
  </form>
  <div id="patient-list">
    {% include "dashboard/partials/patient_list.html" %}
  </div>
  {% include "dashboard/partials/add_patient_modal.html" %}

  <!-- Edit Modal -->
  <div x-show="editOpen" class="cf-modal-backdrop" x-cloak @click.self="editOpen=false">
    <div class="cf-modal max-w-xl" @click.stop>
      <div id="edit-modal-body" class="p-6"></div>
    </div>
  </div>
</div>
{% endblock %}
