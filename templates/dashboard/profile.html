{% extends "dashboard/base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<div class="cf-page">
  <div class="cf-page-header">
    <div>
      <h1 class="cf-page-title ui-page-title">Profile</h1>
      <p class="cf-page-description break-words">{{ request.user.display_name }} · <span class="break-all">{{ request.user.email }}</span> · {{ clinic.name }}</p>
    </div>
  </div>

  <section class="cf-card">
    <div class="grid gap-5 md:grid-cols-2">
    <div class="cf-field">
      <label for="profile-display-name" class="cf-label">Full Name</label>
      <input id="profile-display-name" disabled value="{{ request.user.display_name }}" class="cf-input cursor-not-allowed">
    </div>
    <div class="cf-field">
      <label for="profile-email" class="cf-label">Email Address</label>
      <input id="profile-email" disabled value="{{ request.user.email }}" class="cf-input cursor-not-allowed">
    </div>
    <div class="cf-field">
      <label for="profile-clinic-name" class="cf-label">Clinic Name</label>
      <input id="profile-clinic-name" disabled value="{{ clinic.name }}" class="cf-input cursor-not-allowed">
    </div>
    <div class="cf-field">
      <label for="profile-timezone" class="cf-label">Timezone</label>
      <input id="profile-timezone" disabled value="{{ clinic.timezone }}" class="cf-input cursor-not-allowed">
    </div>
    </div>
  </section>
</div>
{% endblock %}
