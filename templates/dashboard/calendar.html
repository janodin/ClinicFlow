{% extends "dashboard/base.html" %}
{% block title %}Calendar{% endblock %}
{% block extra_head %}
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<style>
  .fc-event { cursor: pointer; }
</style>
{% endblock %}
{% block content %}
<div class="mb-6">
  <h1 class="ui-page-title">Calendar</h1>
  <p class="mt-2 text-[var(--cf-muted)]">Drag-ready appointment calendar with status colors.</p>
</div>

<!-- Filters & Legend -->
<div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
  <div class="flex flex-wrap gap-3">
    <select id="filter-service" class="ui-input ui-select w-auto">
      <option value="">All Services</option>
      {% for service in clinic.services.all %}
        <option value="{{ service.id }}">{{ service.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="cf-card p-3">
    <div class="flex flex-wrap gap-4">
      <div class="flex items-center gap-2"><span class="h-3 w-3 rounded-full bg-[var(--cf-amber)]"></span><span class="text-xs font-semibold text-[var(--cf-muted)]">Booked</span></div>
      <div class="flex items-center gap-2"><span class="h-3 w-3 rounded-full bg-[var(--cf-blue)]"></span><span class="text-xs font-semibold text-[var(--cf-muted)]">Confirmed</span></div>
      <div class="flex items-center gap-2"><span class="h-3 w-3 rounded-full bg-[var(--cf-brand)]"></span><span class="text-xs font-semibold text-[var(--cf-muted)]">Completed</span></div>
      <div class="flex items-center gap-2"><span class="h-3 w-3 rounded-full bg-[var(--cf-red)]"></span><span class="text-xs font-semibold text-[var(--cf-muted)]">Cancelled</span></div>
      <div class="flex items-center gap-2"><span class="h-3 w-3 rounded-full bg-[var(--cf-muted)]"></span><span class="text-xs font-semibold text-[var(--cf-muted)]">No-show</span></div>
    </div>
  </div>
</div>

<div x-data="{ detailOpen: false }" @open-modal.window="detailOpen = true" @keydown.escape.window="detailOpen = false" class="cf-card p-5" style="height: calc(100vh - 240px);">
  <div id="calendar" style="height: 100%;"></div>

  <div x-show="detailOpen" x-cloak class="cf-modal-backdrop" @click.self="detailOpen = false">
    <div class="cf-modal max-w-2xl" @click.stop>
      <div id="detail-modal-body" class="p-6">
        <div class="flex items-center justify-center py-8">
          <svg class="animate-spin h-6 w-6 text-[var(--cf-brand)]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span class="ml-2 text-sm text-[var(--cf-muted)]">Loading appointment details...</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const calendarEl = document.getElementById('calendar');
  const calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    height: '100%',
    expandRows: true,
    dayMaxEvents: 5,
    displayEventTime: false,
    moreLinkText: '+{num} more',
    headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek,timeGridDay' },
    editable: true,
    eventDrop: function(info) {
      const formData = new FormData();
      formData.append('appointment_id', info.event.id);
      formData.append('starts_at', info.event.start.toISOString());
      formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');

      fetch('{% url "dashboard:calendar_reschedule" %}', {
        method: 'POST',
        headers: { 'X-CSRFToken': '{{ csrf_token }}' },
        body: formData,
      })
      .then(response => response.json())
      .then(data => {
        if (!data.success) {
          info.revert();
          window.dispatchEvent(new CustomEvent('toast-message', {
            detail: { message: data.error || 'Could not reschedule appointment.', type: 'error' }
          }));
        } else {
          window.dispatchEvent(new CustomEvent('toast-message', {
            detail: { message: 'Appointment rescheduled successfully.', type: 'success' }
          }));
        }
      })
      .catch(err => {
        info.revert();
        window.dispatchEvent(new CustomEvent('toast-message', {
          detail: { message: 'Network error. Could not reschedule.', type: 'error' }
        }));
      });
    },
    eventClick: function(info) {
      info.jsEvent.preventDefault();
      document.querySelectorAll('.fc-popover').forEach(el => el.remove());
      window.dispatchEvent(new CustomEvent('open-modal'));
      // Reset modal body to loading state before HTMX swap
      document.getElementById('detail-modal-body').innerHTML = `
        <div class="flex items-center justify-center py-8">
          <svg class="animate-spin h-6 w-6 text-[var(--cf-brand)]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span class="ml-2 text-sm text-[var(--cf-muted)]">Loading appointment details...</span>
        </div>
      `;
      htmx.ajax('GET', info.event.url, { target: '#detail-modal-body', swap: 'innerHTML' });
    },
    events: function(fetchInfo, successCallback, failureCallback) {
      const service = document.getElementById('filter-service').value;
      let url = '{% url "dashboard:calendar_events" %}';
      const params = new URLSearchParams();
      params.append('start', fetchInfo.startStr);
      params.append('end', fetchInfo.endStr);
      if (service) params.append('service', service);
      url += '?' + params.toString();

      fetch(url)
        .then(response => response.json())
        .then(data => successCallback(data))
        .catch(err => failureCallback(err));
    }
  });
  calendar.render();

  document.getElementById('filter-service').addEventListener('change', () => calendar.refetchEvents());
});
</script>
{% endblock %}
